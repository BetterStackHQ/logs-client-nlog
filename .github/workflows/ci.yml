name: CI

on:
  workflow_dispatch:
  workflow_call: # the Release workflow runs these checks before it packs
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.framework }} with NLog ${{ matrix.nlog }}
    runs-on: ${{ matrix.framework == 'net48' && 'windows-latest' || 'ubuntu-latest' }}
    strategy:
      matrix:
        framework: [net8.0, net10.0, net48]
        # The library is compiled against 4.7.11, its lowest supported NLog. The tests then load the
        # NLog version given here, like an application that uses a newer NLog than the library.
        # A floating version takes the newest release of that major.
        nlog: ["4.7.11", "4.*", "5.*", "6.*"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # The newest SDK builds every target framework, the 8.0 one brings the runtime for net8.0
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Run tests
        run: dotnet test tests/BetterStack.Logs.NLog.Tests --framework ${{ matrix.framework }} -p:NLogVersion=${{ matrix.nlog }}
